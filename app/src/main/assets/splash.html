<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark">
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060B14; }
body {
  background: radial-gradient(circle at 50% 40%, #13253F 0%, #060B14 72%);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  -webkit-user-select: none; user-select: none;
}
.logo { width: min(88vw, 50vh); height: min(88vw, 50vh); }
.logo svg { width: 100%; height: 100%; display: block; }
.bgv { display: none; }
.wm {
  width: min(58vw, 320px); height: auto; margin-top: 1vh;
  opacity: 0; animation: wmIn .95s cubic-bezier(.16, 1, .3, 1) 2.15s both;
}
.tag {
  margin-top: 14px; color: #35D4FF; font-family: sans-serif; font-weight: 500;
  font-size: 13px; letter-spacing: .5em; padding-left: .5em;
  opacity: 0; animation: wmIn .9s cubic-bezier(.16, 1, .3, 1) 2.55s both;
}
@keyframes wmIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="logo">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
<title>Freeze Eye Logo</title>
<style>
.stroke{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.65,0,.35,1) .25s both,strokeOut .45s ease 1.35s both}
.bodyg{animation:fade .7s ease .95s both}
.eye{transform-box:fill-box;transform-origin:center;animation:eyeOpen .85s cubic-bezier(.16,1,.3,1) 1.35s both}
.logoScale{transform-box:fill-box;transform-origin:center;animation:logoIn 1.9s cubic-bezier(.16,1,.3,1) .2s both}
.starHole{transform-box:fill-box;transform-origin:center;animation:holePop .9s cubic-bezier(.2,.8,.2,1) 1.85s both}
.star{transform-box:fill-box;transform-origin:center;animation:starPop .9s cubic-bezier(.2,.8,.2,1) 1.85s both}
.breathe{opacity:.8;animation:breathe 3s ease-in-out 2.9s infinite}
.ring{transform-box:fill-box;transform-origin:center;vector-effect:non-scaling-stroke;opacity:0;animation:ring 1.15s cubic-bezier(.1,.7,.3,1) 2s forwards}
.ring2{animation-delay:2.2s}
.shim{transform-box:fill-box;transform-origin:center;animation:shim 1s cubic-bezier(.45,0,.2,1) 2.15s both}
.bgv{animation:fade .6s ease 0s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes strokeOut{to{opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes eyeOpen{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes logoIn{from{transform:scale(.9)}to{transform:scale(1)}}
@keyframes holePop{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes starPop{0%{transform:scale(0) rotate(-90deg);opacity:0}15%{opacity:1}60%{transform:scale(1.18) rotate(8deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes breathe{0%,100%{opacity:.8}50%{opacity:1}}
@keyframes ring{0%{transform:scale(.3);opacity:1}100%{transform:scale(3.4);opacity:0}}
@keyframes shim{0%{transform:translateX(-1000px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(1000px);opacity:0}}
</style>
<defs>
  <radialGradient id="bgG" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="#13253F"/><stop offset="1" stop-color="#060B14"/></radialGradient>
  <linearGradient id="markG" gradientUnits="userSpaceOnUse" x1="0" y1="-557" x2="0" y2="557"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#E3F5FF"/><stop offset="1" stop-color="#8CD2FF"/></linearGradient>
  <linearGradient id="starG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B4F5FF"/><stop offset="1" stop-color="#1FC3F7"/></linearGradient>
  <linearGradient id="shimG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="26"/></filter>
  <clipPath id="bodyClip"><path d="M0 -557 C0 -429.3 49.2 -368 150 -319 C281.7 -255 413.3 -191 545 -127 C594 -103.2 627.8 -79 670 -45 C706.2 -15.8 735.1 0 785 0 C735.1 -0 706.2 15.8 670 45 C627.8 79 594 103.2 545 127 C413.3 191 281.7 255 150 319 C49.2 368 0 429.3 0 557 C-0 429.3 -49.2 368 -150 319 C-281.7 255 -413.3 191 -545 127 C-594 103.2 -627.8 79 -670 45 C-706.2 15.8 -735.1 -0 -785 -0 C-735.1 0 -706.2 -15.8 -670 -45 C-627.8 -79 -594 -103.2 -545 -127 C-413.3 -191 -281.7 -255 -150 -319 C-49.2 -368 -0 -429.3 -0 -557 Z"/></clipPath>
  <clipPath id="lowerHalf"><rect x="-1000" y="0" width="2000" height="1000"/></clipPath>
  <mask id="holes" maskUnits="userSpaceOnUse" x="-1000" y="-1000" width="2000" height="2000">
    <rect x="-1000" y="-1000" width="2000" height="2000" fill="#fff"/>
    <path class="eye" d="M-98.5 -142 C-227 -104.2 -295.7 -63.6 -403.5 0 C-295.7 63.6 -227 104.2 -98.5 142 A172.8 172.8 0 0 1 -98.5 -142 Z" fill="#000"/>
    <path class="eye" d="M98.5 -142 C227 -104.2 295.7 -63.6 403.5 0 C295.7 63.6 227 104.2 98.5 142 A172.8 172.8 0 0 0 98.5 -142 Z" fill="#000"/>
    <path class="starHole" d="M0 -133.5 C12.3 -60.5 46.6 -17.6 122.5 0 C46.6 17.6 12.3 60.5 0 133.5 C-12.3 60.5 -46.6 17.6 -122.5 -0 C-46.6 -17.6 -12.3 -60.5 -0 -133.5 Z" fill="#000"/>
  </mask>
</defs>
<g class="bgv"><rect width="1024" height="1024" fill="url(#bgG)"/></g>
<g transform="translate(512 512) scale(0.42)">
 <g class="logoScale">
  <g class="bodyg" mask="url(#holes)">
    <path d="M0 -557 C0 -429.3 49.2 -368 150 -319 C281.7 -255 413.3 -191 545 -127 C594 -103.2 627.8 -79 670 -45 C706.2 -15.8 735.1 0 785 0 C735.1 -0 706.2 15.8 670 45 C627.8 79 594 103.2 545 127 C413.3 191 281.7 255 150 319 C49.2 368 0 429.3 0 557 C-0 429.3 -49.2 368 -150 319 C-281.7 255 -413.3 191 -545 127 C-594 103.2 -627.8 79 -670 45 C-706.2 15.8 -735.1 -0 -785 -0 C-735.1 0 -706.2 -15.8 -670 -45 C-627.8 -79 -594 -103.2 -545 -127 C-413.3 -191 -281.7 -255 -150 -319 C-49.2 -368 -0 -429.3 -0 -557 Z" fill="url(#markG)"/>
    
    <g clip-path="url(#bodyClip)"><polygon class="shim" points="-90,-700 70,-700 -30,700 -190,700" fill="url(#shimG)"/></g>
  </g>
  <path class="stroke" d="M0 -557 C0 -429.3 49.2 -368 150 -319 C281.7 -255 413.3 -191 545 -127 C594 -103.2 627.8 -79 670 -45 C706.2 -15.8 735.1 0 785 0 C735.1 -0 706.2 15.8 670 45 C627.8 79 594 103.2 545 127 C413.3 191 281.7 255 150 319 C49.2 368 0 429.3 0 557 C-0 429.3 -49.2 368 -150 319 C-281.7 255 -413.3 191 -545 127 C-594 103.2 -627.8 79 -670 45 C-706.2 15.8 -735.1 -0 -785 -0 C-735.1 0 -706.2 -15.8 -670 -45 C-627.8 -79 -594 -103.2 -545 -127 C-413.3 -191 -281.7 -255 -150 -319 C-49.2 -368 -0 -429.3 -0 -557 Z" pathLength="1" fill="none" stroke="#8BE3FF" stroke-width="7" stroke-linejoin="round" />
  <g class="breathe"><path class="star" d="M0 -133.5 C12.3 -60.5 46.6 -17.6 122.5 0 C46.6 17.6 12.3 60.5 0 133.5 C-12.3 60.5 -46.6 17.6 -122.5 -0 C-46.6 -17.6 -12.3 -60.5 -0 -133.5 Z" fill="#35D4FF" filter="url(#blur)" opacity=".85"/></g>
  <path class="star" d="M0 -133.5 C12.3 -60.5 46.6 -17.6 122.5 0 C46.6 17.6 12.3 60.5 0 133.5 C-12.3 60.5 -46.6 17.6 -122.5 -0 C-46.6 -17.6 -12.3 -60.5 -0 -133.5 Z" fill="url(#starG)" stroke="url(#starG)" stroke-width="3" stroke-linejoin="round"/>
  
      <circle class="ring" cx="0" cy="0" r="110" fill="none" stroke="#7DE7FF" stroke-width="4"/>
      <circle class="ring ring2" cx="0" cy="0" r="110" fill="none" stroke="#7DE7FF" stroke-width="3"/>
 </g>
</g>
</svg>
</div>
<img class="wm" src="wordmark.png" alt="Blutheist">
<div class="tag">NETFREEZE</div>
</body>
</html>
