<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blutheist</title>
<style>
  :root { --s: min(40vw, 30vh); }
  html, body { margin: 0; height: 100%; background: #000; }
  .stage {
    height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .logo { width: var(--s); height: auto; display: block; overflow: visible; }
  .wm {
    position: relative; width: calc(var(--s) * 1.81); aspect-ratio: 961 / 222;
    margin-top: calc(var(--s) * .22);
  }
  .L { position: absolute; top: 0; height: 100%; display: block; }

  /* Base styles = the finished logo. Animations only run under .play. */
  .o, .i { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .ring { opacity: 0; }
  .eye-outer, .almond, .star, .ring { transform-box: fill-box; transform-origin: center; }
  .L { transform-origin: 50% 100%; }

  .play .o      { animation: draw 1s cubic-bezier(.65, 0, .35, 1) .15s both; }
  .play .i      { animation: draw 1s cubic-bezier(.65, 0, .35, 1) .4s both; }
  .play .L      { animation: letter .75s cubic-bezier(.22, 1, .36, 1) calc(.3s + var(--i) * .09s) both; }
  .play .eye-outer { animation: iconIn .6s cubic-bezier(.22, 1, .36, 1) 1s both; }
  .play .almond { animation: eyeOpen .65s cubic-bezier(.22, 1, .36, 1) 1.4s both; }
  .play .drop   { animation: drop .85s cubic-bezier(.34, 1.25, .64, 1) 1.95s both; }
  .play .star   { animation: twinkle .55s ease-in-out 2.7s both; }
  .play .ring   { animation: ring .8s ease-out 2.8s both; }

  @keyframes draw    { 0% { stroke-dashoffset: 1; opacity: 0; } 1% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes letter  {
    from { opacity: 0; transform: translateY(45%) scale(.9); filter: blur(10px); }
    60%  { filter: blur(0); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  @keyframes iconIn  { from { opacity: 0; transform: scale(.8); } to { opacity: 1; transform: none; } }
  @keyframes eyeOpen { from { transform: scale(.6, .02); } to { transform: none; } }
  @keyframes drop    { from { transform: translateY(-340px); } to { transform: none; } }
  @keyframes twinkle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.22); } }
  @keyframes ring    { from { opacity: .45; transform: scale(1); } to { opacity: 0; transform: scale(1.2); } }
</style>
</head>
